name: Refresh fixture suggestions
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fixture-suggestions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Refresh bounded schedule and TV suggestions
        run: node scripts/update-fixtures.mjs
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      - name: Commit changed fixture suggestions
        run: |
          if git diff --quiet -- fixtures.json; then
            echo "Fixture suggestions are unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fixtures.json
            git commit -m "Refresh fixture suggestions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
